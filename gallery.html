<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together in Color Art | Gallery</title>
    <link rel="icon" href="/assets/images/together-icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background: linear-gradient(135deg, #fff5f7 0%, #fce7d9 15%, #e0f2fe 30%, #f0e7ff 45%, #fef3c7 60%, #ecfdf5 75%, #fef2f2 90%, #f3e8ff 100%); background-attachment: fixed; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); border-radius: 2rem; overflow: hidden; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 20px 40px rgba(15,23,42,0.08); }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <nav class="z-50 flex justify-between items-center px-6 py-4 glass sticky top-0">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🎨</span>
            <a href="index.html" class="text-xl font-black text-rose-600 tracking-tighter uppercase">Together in Color</a>
        </div>
        <div class="flex space-x-4 md:space-x-8 text-[10px] font-bold uppercase tracking-widest items-center">
            <a href="gallery.html" class="text-purple-600 px-3 py-2 rounded-lg bg-purple-50">Gallery</a>
            <a href="submit.html" class="text-pink-600 px-3 py-2 rounded-lg hover:bg-pink-50 transition">Give Art</a>
            <a href="request.html" class="text-cyan-600 px-3 py-2 rounded-lg hover:bg-cyan-50 transition">Get Art</a>
            <a href="volunteer.html" class="text-emerald-600 px-3 py-2 rounded-lg hover:bg-emerald-50 transition">Volunteer</a>
            <a href="contact.html" class="text-rose-600 px-3 py-2 rounded-lg hover:bg-rose-50 transition">Contact</a>
            <a href="index.html#about-me" class="text-orange-600 hidden sm:inline-block px-3 py-2 rounded-lg hover:bg-orange-50 transition">About Me</a>
        </div>
    </nav>
    <main class="flex-grow px-6 py-8 max-w-6xl mx-auto w-full">
        <section class="glass p-8 mb-8">
            <div class="max-w-3xl mx-auto text-center">
                <p class="text-sm uppercase tracking-[0.4em] text-stone-400">Art Gallery</p>
                <h1 class="text-4xl md:text-5xl font-black text-slate-900 leading-tight mt-4">Browse the paintings that bring color to children in need.</h1>
                <p class="mt-4 text-stone-600 text-sm md:text-base leading-relaxed">Each artwork here was donated by young artists and is ready to create joy for a child in need.</p>
            </div>
        </section>
        <section class="grid gap-6 md:grid-cols-2 lg:grid-cols-3" id="gallery-grid">
            <!-- Gallery items will be loaded dynamically -->
        </section>

        <script>
            async function loadGallery() {
                try {
                    const response = await fetch('artwork-data.json');
                    const artworks = await response.json();

                    const galleryGrid = document.getElementById('gallery-grid');

                    artworks.forEach(artwork => {
                        const card = document.createElement('a');
                        card.href = `display.html?id=${artwork.id}`;
                        card.className = 'card p-6 block hover:shadow-xl transition';
                        card.innerHTML = `
                            <div class="h-48 rounded-3xl bg-gradient-to-br ${artwork.colors}"></div>
                            <div class="mt-5">
                                <p class="text-xs uppercase tracking-[0.4em] text-rose-500 font-bold">${artwork.title}</p>
                                <h2 class="mt-3 text-xl font-black text-slate-900">${artwork.title}</h2>
                                <p class="mt-2 text-stone-600 text-sm">By ${artwork.artist}, ${artwork.grade} • Donated with love</p>
                            </div>
                        `;
                        galleryGrid.appendChild(card);
                    });
                } catch (error) {
                    console.error('Error loading gallery:', error);
                    // Fallback to placeholder content
                    document.getElementById('gallery-grid').innerHTML = `
                        <div class="col-span-full text-center py-12">
                            <p class="text-stone-500">Gallery is loading... Please check back soon!</p>
                        </div>
                    `;
                }
            }

            // Load gallery when page loads
            loadGallery();
        </script>
    </main>
    <footer class="py-4 text-center glass border-t border-white/50">
        <p class="text-[9px] font-black text-stone-400 uppercase tracking-[0.4em]">&copy; 2026 Together in Color Art</p>
    </footer>
</body>
</html>
